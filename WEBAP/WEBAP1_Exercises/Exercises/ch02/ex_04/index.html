<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>A1 – Task 4</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $("button#load").click(function () {
                let data = $get("cars.txt", function()
                {
                    let cars = data.split(";");
                }); 
                $("#brands").load(cars);       
            });
        }); 
    </script>
</head>

<body>
    <select id="brands"></select>
    <button id="load">Load brands</button>
</body>
</html>
